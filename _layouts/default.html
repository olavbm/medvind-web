<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · Medvind Utvikling</title>
<meta name="description" content="{{ page.excerpt | default: page.description | default: 'Blogg fra Medvind Utvikling AS.' | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="article">
<meta property="og:locale" content="nb_NO">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..700&family=Inter:wght@400;500;600&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a href="/" class="logo">Medvind Utvikling</a>
      <nav class="nav">
        <a href="/blogg/">Blogg</a>
        <a href="/#folk">Folk</a>
        <a href="/#kontakt">Kontakt</a>
      </nav>
    </div>
  </header>

  <main class="wrap main">
{{ content }}
  </main>

  <footer id="kontakt" class="footer">
    <div class="wrap footer__inner">
      <div class="footer__top">
        <div class="footer__cta">
          <div class="eyebrow eyebrow--inverse">Kontakt</div>
          <p class="footer__headline">Står prosjektet stille? Vi har vind i seilene.</p>
        </div>
        <a href="mailto:olav@medvind.eu" class="button">Send en e-post</a>
      </div>
      <div class="footer__meta">
        <span>Medvind Utvikling AS · Ormen Langes vei 12, 7041 Trondheim</span>
        <span class="mono">Org.nr. 937 332 610</span>
      </div>
    </div>
  </footer>
</div>
<script data-goatcounter="https://medvind.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
